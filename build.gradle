plugins {
    id 'eclipse'
    id 'idea'
    id 'maven-publish'
    id 'net.minecraftforge.gradle' version '[6.0,6.2)'
    id 'org.parchmentmc.librarian.forgegradle' version '1.+'
    id 'com.github.johnrengelman.shadow' version '8.1.1' apply false
    id 'java'
}

group = 'com.forgebook'
version = '0.1.0'
java.toolchain.languageVersion = JavaLanguageVersion.of(17)

minecraft {
    mappings channel: 'parchment', version: '2023.09.03-1.20.1'
    runs {
        client {
            workingDirectory project.file('run')
            property 'forge.logging.console.level', 'debug'
            mods { forgebook { source sourceSets.main } }
        }
        server {
            workingDirectory project.file('run/server')
            property 'forge.logging.console.level', 'debug'
            mods { forgebook { source sourceSets.main } }
        }
        gameTestServer {
            workingDirectory project.file('run/gametest')
            property 'forge.logging.markers', 'REGISTRIES'
            property 'forge.logging.console.level', 'debug'
            property 'forge.enabledGameTestNamespaces', 'forgebook'
            mods { forgebook { source sourceSets.main } }
        }
    }
}

// Separate config so the raw jsoup jar isn't on the compile classpath directly.
configurations { jsoupToRelocate }

dependencies {
    minecraft 'net.minecraftforge:forge:1.20.1-47.4.18'
    // The relocated jsoup (nested by jarJar) is what runtime sees.
    jsoupToRelocate "org.jsoup:jsoup:${jsoupVersion}"
    // Compile-time: we need jsoup on the classpath so code in Phase 2 can compile against com.forgebook.shadow.jsoup.*.
    // Use compileOnly to avoid double-bundling; jarJar bundles the relocated jar at runtime.
    compileOnly "org.jsoup:jsoup:${jsoupVersion}"
    testImplementation "org.jsoup:jsoup:${jsoupVersion}"
    testImplementation 'org.junit.jupiter:junit-jupiter:5.10.2'
    testImplementation 'org.mockito:mockito-core:5.11.0'
}

// Bytecode-relocation task (ShadowJar-as-class, NOT plugin application).
tasks.register('relocateJsoup',
        com.github.jengelman.gradle.plugins.shadow.tasks.ShadowJar) {
    archiveBaseName.set('jsoup-relocated')
    archiveVersion.set(jsoupVersion)
    destinationDirectory.set(layout.buildDirectory.dir('relocated'))
    configurations = [project.configurations.jsoupToRelocate]
    relocate 'org.jsoup', 'com.forgebook.shadow.jsoup'
}

dependencies {
    jarJar files(tasks.relocateJsoup)
}

tasks.named('jarJar') { dependsOn 'relocateJsoup' }

test {
    useJUnitPlatform()
}

jar {
    manifest {
        attributes([
            "Specification-Title"     : "forgebook",
            "Specification-Vendor"    : "Nick Doxa",
            "Specification-Version"   : "1",
            "Implementation-Title"    : project.name,
            "Implementation-Version"  : project.version,
            "Implementation-Vendor"   : "Nick Doxa"
        ])
    }
}
