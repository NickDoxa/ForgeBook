plugins {
    id 'eclipse'
    id 'idea'
    id 'maven-publish'
    id 'net.minecraftforge.gradle' version '[6.0,6.2)'
    id 'org.parchmentmc.librarian.forgegradle' version '1.+'
    id 'java'
}

group = 'com.forgebook'
version = '1.0.5'
java.toolchain.languageVersion = JavaLanguageVersion.of(17)

minecraft {
    mappings channel: 'parchment', version: '2023.09.03-1.20.1'
    runs {
        client {
            workingDirectory project.file('run')
            property 'forge.logging.console.level', 'debug'
            mods { forgebook { source sourceSets.main } }
        }
        server {
            workingDirectory project.file('run/server')
            property 'forge.logging.console.level', 'debug'
            mods { forgebook { source sourceSets.main } }
        }
        gameTestServer {
            workingDirectory project.file('run/gametest')
            property 'forge.logging.markers', 'REGISTRIES'
            property 'forge.logging.console.level', 'debug'
            property 'forge.enabledGameTestNamespaces', 'forgebook'
            mods { forgebook { source sourceSets.main } }
        }
    }
}

// Dedicated config for the jsoup artifact that gets merged into the main jar.
// Kept off `implementation` so it doesn't leak into consumers' compile classpaths.
configurations { jsoupBundled }

dependencies {
    minecraft 'net.minecraftforge:forge:1.20.1-47.4.18'
    // Bundled copy — its classes are merged into the main jar at build time,
    // under the original `org.jsoup.*` package so compile-time imports match
    // runtime. (1.0.5: prior relocation to `com.forgebook.shadow.jsoup.*`
    // rewrote jsoup's own bytecode but left our call sites pointing at
    // `org.jsoup.*`, producing NoClassDefFoundError the first time
    // fetch_mod_docs_page or DuckDuckGoHtmlAdapter was actually invoked.)
    jsoupBundled "org.jsoup:jsoup:${jsoupVersion}"
    compileOnly "org.jsoup:jsoup:${jsoupVersion}"
    testImplementation "org.jsoup:jsoup:${jsoupVersion}"
    testImplementation 'org.junit.jupiter:junit-jupiter:5.10.2'
    testImplementation 'org.mockito:mockito-core:5.11.0'
}

test {
    useJUnitPlatform()
}

jar {
    // Merge jsoup's classes directly into the main jar under `org.jsoup.*`.
    // No relocation: our source imports `org.jsoup.Jsoup` and compile-time
    // `compileOnly` already resolves to the same package, so keeping the
    // runtime package aligned is what lets ModDocsScraper and
    // DuckDuckGoHtmlAdapter resolve at class-load time.
    // Deferred closure — resolving `jsoupBundled` eagerly at configuration
    // time triggers ForgeGradle's bundled-deobf repo before it's finalized
    // ("Cannot mutate content repository descriptor"). Wrapping in a closure
    // postpones resolution to execution time.
    from({ configurations.jsoupBundled.collect { zipTree(it) } }) {
        // Strip everything from jsoup's jar except its classes. The merge
        // would otherwise bring in:
        //   - META-INF/MANIFEST.MF         (overwrites ours)
        //   - META-INF/LICENSE, README.md  (misattributes ForgeBook's license)
        //   - META-INF/maven/org.jsoup/**  (obsolete POM)
        //   - META-INF/versions/9/module-info.class (jsoup's JPMS descriptor —
        //       confuses the JDK ModuleLayer and, critically, Minecraft 1.20.1's
        //       resource-pack loader, breaking resource packs in the host modpack)
        //   - META-INF/*.SF/DSA/RSA         (jar signatures we can't honor)
        // jsoup has no classes outside org/** so dropping all META-INF/ is safe.
        exclude 'META-INF/**'
    }
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE

    manifest {
        attributes([
            "Specification-Title"     : "forgebook",
            "Specification-Vendor"    : "Nick Doxa",
            "Specification-Version"   : "1",
            "Implementation-Title"    : project.name,
            "Implementation-Version"  : project.version,
            "Implementation-Vendor"   : "Nick Doxa"
        ])
    }
}
